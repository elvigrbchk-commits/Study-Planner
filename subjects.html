<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Subjects</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="subjects.css">
    <link rel="stylesheet" href="site-layout.css">

    <link rel="icon" type="image/x-icon" href="./images/favicon SP.ico">
</head>

<body>

    <header class="site-header">

        <a href="index.html" class="logo-link" aria-label="Go to Dashboard">
            <img src="images/logo pink.png" alt="Study Planner" class="logoHat">
        </a> 

        <nav class="menu">
            <a href="index.html">Dashboard</a>

            <a href="subjects.html"
               class="active"
               aria-current="page">
                Subjects
            </a>

            <a href="tasks.html">Tasks</a>
            <a href="Calendar.html">Calendar</a>
            <a href="progress.html">Progress</a>
        </nav>

    </header>

    <main class="subjects-page">

        <section class="subjects-header">

            <div>
                <h1>My Subjects</h1>
                <p>Manage your subjects and track your study progress.</p>
            </div>


            <details class="add-subject">

                <summary>+ Add Subject</summary>

                <form class="subject-form">
                    
                    <label>
                        Subject Name
                        <input type="text" id="subject-name" placeholder="Enter subject">
                        <small id="name-error" class="field-error"></small>
                    </label>
                    
                    <label>
                        Description
                        <input type="text" id="subject-description" placeholder="Enter description">
                        <small id="description-error" class="field-error"></small>
                    </label>

                    <button type="submit">Add</button>

                </form>

            </details>

        </section>

        <div class="subject-tools">
            <label for="subject-search">Search Subjects</label>
            
            <input
            type="search"
            id="subject-search"
            placeholder="Search subjects..."
            >
            
            <span id="subjects-count"></span>
        </div>

<p id="subject-feedback" role="status"
   aria-live="polite"></p>

        <section class="subjects-grid row g-4">
        </section>

    </main>

    <footer class="footer">
        <p>© 2026 STUDY PLANNER</p>
        
        <div class="footer-links">
            <a href="contact.html" class="footer-link">Contact us</a>
            <a href="about.html" class="footer-link">About us</a>
        </div>

    </footer>

    <script src="subjects.js"></script>

</body>

</html>
