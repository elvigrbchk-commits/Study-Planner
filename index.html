<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Dashboard</title>
        <link rel="stylesheet" href="styles.css">
         <link rel="icon" type="image/x-icon" href="./images/favicon SP.ico">
    </head>
    <body>
        <header class="container">
            <img src="images/logo pink.png" alt="Hat" class="logoHat">
            <nav class="menu">
                <a href="index.html"  class="dash">Dashboard</a>
                <a href="" >Subjects</a>
                <a href="tasks.html" >Tasks</a>
                <a href="Calendar.html" >Calendar</a>
                <a href="progress.html" >Progress</a>
            </nav>
        </header>

  <main class="dashboard">

        <div class="dashboard-header">
    <h1>Dashboard</h1>

    <details class="add-task">
        <summary>+ Add task</summary>

        <form class="task-form">
           
            <label>
                Subject
                <input type="text" placeholder="Enter subject">
            </label>

            <label>
                Task
                <input type="text" placeholder="Enter task">
            </label>

            <label>
                Date
                <input type="date">
            </label>

            <button type="submit">Add</button>
        </form>
    </details>
</div>

        <section class="dashboard-cards">

            <div class="card">
                <h2>TODAY'S TASKS</h2>

                <div class="task-list">
                    <label>
                        <input type="checkbox">
                        Read Chapter 3
                    </label>

                    <label>
                        <input type="checkbox">
                        Finance Homework
                    </label>

                    <label>
                        <input type="checkbox">
                        Finish Wireframe
                    </label>
                </div>
            </div>

            <div class="card">
                <h2>UPCOMING DEADLINES</h2>

                <div class="deadline-list">
                    <p>Web Assignment <span>Sep 22</span></p>
                    <p>OS Quiz <span>Sep 24</span></p>
                    <p>Finance Exam <span>Sep 28</span></p>
                </div>
            </div>

        </section>

        <section class="progress">
            <p>Overall Progress</p>
            <div class="progress-bar">
                <div class="progress-value"></div>
            </div>
        </section>

    </main>

         <footer class="footer">
        <p>&copy; 2026 STUDY PLANNER</p>
        <div class="footer-links"> 
            <a href="" class="footer-link">Contact us</a>
            <a href="" class="footer-link">About us</a>
        </div>
    </footer>
    </body>
</html>
