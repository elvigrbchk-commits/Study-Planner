<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Calendar</title>
        <link rel="stylesheet" href="Calendar.css">
        <link rel="stylesheet" href="site-layout.css">
        <link rel="icon" type="image/x-icon" href="./images/favicon SP.ico">
    </head>
    <body>
        <header class="site-header">
            <img src="images/logo pink.png" alt="Hat" class="logoHat">
            <nav class="menu">
                <a href="index.html">Dashboard</a>
                <a href="subjects.html">Subjects</a>
                <a href="tasks.html" >Tasks</a>
                <a href="Calendar.html" class="active" aria-current="page">Calendar</a>
                <a href="progress.html" >Progress</a>
            </nav>
        </header>
        <main class="calendar-page">

    <div class="calendar-header">
        <h1>Calendar</h1>

        <div class="month">
            <button id="prev-month" type="button">❮</button>
            <span id="month-title"></span>
            <button id="next-month" type="button">❯</button>
        </div>

    </div>

    <section class="calendar-box">

        <table class="calendar-table">

            <thead>
                <tr>
                    <th>MON</th>
                    <th>TUE</th>
                    <th>WED</th>
                    <th>THU</th>
                    <th>FRI</th>
                    <th>SAT</th>
                    <th>SUN</th>
                </tr>
            </thead>

            <tbody id="calendar-days"></tbody>

        </table>

        <div class="calendar-details">
            <h3 id="selected-date">Select a date</h3>
            <div id="day-tasks">Click a date to see tasks.</div>
        </div>

    </section>

    </main>
            <footer class="footer">
        <p>&copy; 2026 STUDY PLANNER</p>
        <div class="footer-links"> 
            <a href="contact.html" class="footer-link">Contact us</a>
            <a href="about.html" class="footer-link">About us</a>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="calendar.js"></script>

    </body>
</html>
