<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calendar</title>
        <link rel="stylesheet" href="Calendar.css">
        <link rel="stylesheet" href="site-layout.css">
        <link rel="icon" type="image/x-icon" href="./images/favicon SP.ico">
    </head>
    <body>
        <header class="site-header">
            <a href="index.html" class="logo-link" aria-label="Go to Dashboard">
                <img src="images/logo pink.png" alt="Study Planner" class="logoHat">
            </a>            
            <nav class="menu">
                <a href="index.html">Dashboard</a>
                <a href="subjects.html">Subjects</a>
                <a href="tasks.html" >Tasks</a>
                <a href="Calendar.html" class="active" aria-current="page">Calendar</a>
                <a href="progress.html" >Progress</a>
            </nav>
        </header>
       
    <main class="calendar-page">

        <div class="calendar-header">
            <h1>Calendar</h1>

            <div class="month" id="month-navigation">
                <button id="prev-month" type="button">❮</button>
                <span id="month-title"></span>
                <button id="next-month" type="button">❯</button>
            </div>

            <div class="weekly-header" id="weekly-header" hidden>
                <button id="prev-week" type="button">❮</button>
                <h2 id="week-title">This Week</h2>
                <button id="next-week" type="button">❯</button>
            </div>

            <div class="calendar-view-toggle">
                <button type="button" id="month-view-btn" class="active">Month</button>
                <button type="button" id="week-view-btn">Week</button>
            </div>
        </div>

        <section class="weekly-calendar" id="week-view" hidden>
            <div class="week-days" id="week-days"></div>

            <h3>This Week's Tasks</h3>
            <div id="week-tasks"></div>
        </section>

        <section class="calendar-box" id="month-view">

            <table class="calendar-table">
                <thead>
                    <tr>
                        <th>MON</th>
                        <th>TUE</th>
                        <th>WED</th>
                        <th>THU</th>
                        <th>FRI</th>
                        <th>SAT</th>
                        <th>SUN</th>
                    </tr>
                </thead>

                <tbody id="calendar-days"></tbody>
            </table>

            <div class="calendar-details">
                <h3 id="selected-date">Select a date</h3>
                <div id="day-tasks">Click a date to see tasks.</div>
            </div>

        </section>

    </main>

            <footer class="footer">
        <p>&copy; 2026 STUDY PLANNER</p>
        <div class="footer-links"> 
            <a href="contact.html" class="footer-link">Contact us</a>
            <a href="about.html" class="footer-link">About us</a>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="calendar.js"></script>

    </body>
</html>
